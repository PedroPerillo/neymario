<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Super Neymario: The Hexa Quest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%23ffdf00%22/%3E%3Ccircle cx=%228%22 cy=%228%22 r=%223%22 fill=%22%23009c3b%22/%3E%3C/svg%3E" />
  </head>
  <body>
    <main class="wrap">
      <canvas id="screen" aria-label="Super Neymario game screen"></canvas>
      <p class="help">
        ←/→ move · Z/Space jump · X/Shift run &amp; shoot Blaze · ↓ crouch · Enter start · P pause · M mute
      </p>
      <div id="touch" class="touch" aria-hidden="true">
        <div class="pad">
          <button data-action="left">◀</button>
          <button data-action="down">▼</button>
          <button data-action="right">▶</button>
        </div>
        <div class="pad">
          <button data-action="start">START</button>
          <button data-action="mute">♪</button>
        </div>
        <div class="pad">
          <button data-action="run" class="round">B</button>
          <button data-action="jump" class="round">A</button>
        </div>
      </div>
      <p class="disclaimer">
        Unofficial fan parody. Not affiliated with or endorsed by Nintendo, Neymar Jr., Kylian Mbappé, FIFA or Blaze.
      </p>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
